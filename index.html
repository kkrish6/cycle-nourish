 out+=sec("Pain and energy",logs.length?chart("Pain (0\u201310) over time","",logs.map(function(l){return {label:fmt(l.date),value:l.pain,vl:l.pain+"/10"}}),[0,10])+chart("Energy (1\u20135) over time","",logs.map(function(l){return {label:fmt(l.date),value:l.energy,vl:l.energy+"/5"}}),[0,5])+cap("Latest 30 logged days. Unlogged dates are not zero.")+'<details><summary>View / edit recent logs</summary>'+S.logs.slice().reverse().slice(0,30).map(function(l){return '<div class="record-row"><div><strong>'+fmt(l.date)+'</strong><small>'+esc(l.flow)+' flow'+(typeof l.pads==="number"?' \u00b7 '+l.pads+' pads':'')+' \u00b7 pain '+l.pain+'/10 \u00b7 energy '+l.energy+'/5 \u00b7 '+esc(l.mood)+'</small><small>'+(esc(l.symptoms.join(", "))||"No symptoms selected")+'</small></div>'+btn("Edit","logday",l.date,true)+'</div>'}).join("")+'</details>':'<p>Save a daily log to start these graphs.</p>');
 return out;
}
function viewSettings(){
 var pr=S.profile;
 var out=sec("Make it hers",'<p>These words appear in the greeting and poems. They are saved only on this device, never on the public site.</p><label class="field"><span>Her name</span><input type="text" maxlength="40" data-f="name" value="'+esc(pr.name||"")+'" autocomplete="off"></label><label class="field"><span>Sweet words after her name (for example: My love)</span><input type="text" maxlength="40" data-f="pet" value="'+esc(pr.pet||"")+'" autocomplete="off"></label><label class="field"><span>A line of your own, shown on Today (optional, use *stars* around words to highlight them)</span><textarea rows="3" maxlength="400" data-f="note">'+esc(pr.note||"")+'</textarea></label>'+cap("Backups contain this too. Keep them private."));
 out+=sec("Personalise your tracker",'<div class="form-grid"><label class="field"><span>Typical cycle length (21\u201345 days)</span><input type="number" min="21" max="45" data-f="cycle" value="'+pr.cycle+'"></label><label class="field"><span>Typical bleeding length (1\u201310 days)</span><input type="number" min="1" max="10" data-f="bleed" value="'+pr.bleed+'"></label></div>'+cap("Prediction settings, not limits. Once you have two starts, the mean of your latest twelve counted intervals replaces the cycle setting.")+choices("Tracking mode",[["regular","Regular cycles"],["irregular","Irregular cycles"],["hormonal","Hormonal contraception"],["paused","Pregnant / postpartum / paused"]],pr.mode,"mode")+cap("Ovulation dates are hidden outside regular mode or when the last twelve counted intervals vary by more than 9 days. The phase on Today is always shown as a rough estimate unless tracking is paused.")+choices("Food preference",[["vegetarian","Vegetarian"],["vegan","Vegan"],["mixed","Includes egg / meat / fish"]],pr.diet,"diet")+'<div class="check-grid">'+AVOID.map(function(v){return '<label><input type="checkbox" data-f="avoid" value="'+v+'"'+(pr.avoid.indexOf(v)>=0?" checked":"")+'>Exclude '+v+'</label>'}).join("")+'</div>');
 out+=sec("Privacy & backup",'<p>Records are stored in this browser for this site. No sign-in. Not sent to your assistant or synced to another device. Clearing browser data can erase them. Private/incognito browsing may erase records when it ends.</p><p>Up to 80 periods and 500 daily logs. A backup contains sensitive health information and her name: store it privately.</p><div class="actions">'+btn("Download backup","backup",undefined,true)+'<label class="file-button" data-variant="secondary">Restore backup<input class="file-picker" type="file" accept=".json,.txt,application/json,text/plain" data-f="restore"></label></div>'+cap("Restore replaces your current records. Download your current backup first.")+(ui.erase?callout("Erase everything on this device?",'<p>This cannot be undone without a backup.</p><div class="actions">'+btn("Yes, erase everything","erase")+btn("Cancel","eraseNo",undefined,true)+'</div>'):btn("Erase all records\u2026","eraseAsk",undefined,true)));
 out+=sec("How dates and phases are estimated",'<p>A cycle runs from one period\'s first day to the next. The central estimate is the latest start plus the mean of your latest twelve counted intervals. The range uses the shortest and longest of them. You can leave an unusual gap out in Trends. Ovulation is estimated about 14 days before the next period.</p><p>The phase on Today uses the day count since the last start: menstrual during bleeding, then follicular, a short ovulatory window, then luteal. It cannot measure hormones, so it is a guess, and a rougher one when cycles vary. No "safe days" are given.</p>');
 out+=sec("On Android",'<p>Open this link in Chrome, then use the menu and "Add to Home screen". Use the same browser and the same site address to keep your records.</p>');
 return out;
}

function render(){
 var c=calc(),ph=phaseNow(c),h='';
 h+='<main class="app"><header><small class="eyebrow">Your rhythm, recorded</small><h1>Cycle &amp; Nourish</h1><p>Track your dates, notice patterns and find balanced meal ideas. Your records stay in this browser, not in a shared database.</p></header>';
 h+='<nav class="tabs" aria-label="Tracker sections">'+TABS.map(function(t){return '<button type="button" data-act="tab" data-v="'+t+'"'+(ui.tab===t?' aria-current="page"':'')+'>'+t+'</button>'}).join("")+'</nav>';
 if(!store.ready)h+=callout("Storage unavailable","Allow local storage before adding records.");
 h+=cap(esc(store.msg));
 if(ui.msg)h+='<div class="notice" role="status">'+esc(ui.msg)+'</div>';
 h+=({Today:function(){return viewToday(c,ph)},Calendar:function(){return viewCalendar(c)},Log:function(){return viewLog(c)},Food:function(){return viewFood(c,ph)},Care:function(){return viewCare(c,ph)},Trends:function(){return viewTrends(c)},Settings:viewSettings})[ui.tab]();
 h+='<section class="group"><h2>For your health</h2>'+callout("A tracker, not medical care","Dates, phases and food ideas are general guidance, not a diagnosis or treatment. Speak with a clinician for heavy bleeding, severe pain, worrying cycle changes or symptoms affecting daily life. Seek urgent help for severe bleeding with faintness or severe pain.")+'<details><summary>Sources & nutrition notes</summary><p>Cycle and nutrition guidance checked 1 Oct 2026. Meal and seed ideas are examples based on general food principles, not clinical phase-specific diets.</p>'+SOURCES.map(function(s){return '<p><a href="'+s[2]+'" target="_blank" rel="noopener noreferrer">'+esc(s[0])+" \u00b7 "+esc(s[1])+"</a></p>"}).join("")+'</details></section><footer>Your records stay on your device. No ads, payments or health-data sharing in this app.</footer></main>';
 var ae=document.activeElement,keep=ae&&ae.getAttribute&&ae.getAttribute("data-f");
 document.getElementById("root").innerHTML=h;
 var y=window.scrollY;window.scrollTo(0,y);
}

/* ---------- actions ---------- */
function parseDates(txt){
 var parts=txt.split(/[\n,;]+/).map(function(s){return s.trim()}).filter(Boolean);
 if(!parts.length)return {err:"Paste at least one date."};
 var out=parts.map(function(s){if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;var m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);return m?m[3]+"-"+pad2(m[2])+"-"+pad2(m[1]):""});
 if(out.some(function(s){return !okDate(s)||s>today}))return {err:"Check every date. Use YYYY-MM-DD or DD/MM/YYYY, one per line. Future dates are not allowed."};
 return {ok:Array.from(new Set(out)).sort()};
}
function withProfile(p,note){var n=Object.assign({},S,{profile:Object.assign({},S.profile,p)});return persist(n,note)}
function sortP(a){return a.slice().sort(function(x,y){return x.start.localeCompare(y.start)})}
var A={
 tab:function(v){ui.tab=v;ui.msg="";window.scrollTo(0,0)},
 food:function(v){ui.fp=Number(v);ui.tab="Food";ui.msg="";window.scrollTo(0,0)},
 logtoday:function(){loadDraft(today);ui.pStart="";ui.pEnd="";ui.tab="Log";window.scrollTo(0,0)},
 logday:function(v){loadDraft(v);ui.tab="Log";window.scrollTo(0,0)},
 pick:function(v){ui.sel=v},
 mprev:function(){var d=P(ui.month+"-01");d.setMonth(d.getMonth()-1);ui.month=iso(d).slice(0,7)},
 mnext:function(){var d=P(ui.month+"-01");d.setMonth(d.getMonth()+1);ui.month=iso(d).slice(0,7)},
 fp:function(v){ui.fp=Number(v)},
 flow:function(v){ui.draft.flow=v},mood:function(v){ui.draft.mood=v},
 mode:function(v){withProfile({mode:v})},diet:function(v){withProfile({diet:v})},
 padm:function(){ui.draft.pads=Math.max(0,ui.draft.pads-1)},
 padp:function(){ui.draft.pads=Math.min(30,ui.draft.pads+1)},
 startToday:function(){
  if(S.periods.some(function(p){return p.start===today})){ui.msg="Today is already recorded as a period start.";return}
  var n=Object.assign({},S,{periods:sortP(S.periods.concat([{start:today,end:""}]))});
  persist(n,"Period start saved for today. Add the last bleeding day when it ends.")},
 endToday:function(){
  var c=calc(),o=c.last;if(!o||o.end){ui.msg="No open period to end.";return}
  var n=Object.assign({},S,{periods:S.periods.map(function(p){return p.start===o.start?{start:p.start,end:today}:p})});
  persist(n,"Period end saved: "+(diff(today,o.start)+1)+" days.")},
 saveP:function(){
  var s=ui.pStart,e=ui.pEnd;
  if(!s||!okDate(s)||s>today||(e&&(!okDate(e)||e<s||e>today||diff(e,s)>30))){ui.msg="Use a real start date on or before today. End must be after start and no later than today.";return}
  var rest=S.periods.filter(function(p){return p.start!==(ui.pEdit||s)&&p.start!==s});
  var list=sortP(rest.concat([{start:s,end:e||""}]));
  if(list.some(function(p,i){return i>0&&list[i-1].end&&p.start<=list[i-1].end})){ui.msg="Period dates overlap. Edit the earlier record first.";return}
  if(persist(Object.assign({},S,{periods:list}),"Period saved. Estimates updated.")){ui.pStart="";ui.pEnd="";ui.pEdit=""}},
 cancelP:function(){ui.pStart="";ui.pEnd="";ui.pEdit=""},
 editP:function(v){var p=S.periods.find(function(x){return x.start===v});if(p){ui.pEdit=p.start;ui.pStart=p.start;ui.pEnd=p.end||"";window.scrollTo(0,0);ui.msg="Editing the period from "+fmt(p.start)+"."}},
 delP:function(v){persist(Object.assign({},S,{periods:S.periods.filter(function(p){return p.start!==v}),profile:Object.assign({},S.profile,{skip:(S.profile.skip||[]).filter(function(x){return x!==v})})}),"Period deleted. Estimates updated.")},
 skipI:function(v){var sk=S.profile.skip||[];var nx=sk.indexOf(v)>=0?sk.filter(function(x){return x!==v}):sk.concat([v]);withProfile({skip:nx},nx.indexOf(v)>=0?"That gap is left out of the average and prediction.":"That gap is counted again.")},
 preview:function(){var r=parseDates(ui.paste);if(r.err){ui.msg=r.err;ui.prev=[];return}ui.prev=r.ok.map(function(d){var f=S.periods.find(function(p){return p.start===d});return {start:d,end:f?f.end:""}});ui.msg="Review "+ui.prev.length+" distinct start dates below, then add them."},
 addprev:function(){
  var list=sortP(S.periods.concat(ui.prev.filter(function(n){return !S.periods.some(function(p){return p.start===n.start})})));
  if(persist(Object.assign({},S,{periods:list}),"History added. Prediction range updated.")){ui.paste="";ui.prev=[]}},
 saveLog:function(){
  var d=ui.draft;
  if(!okDate(d.date)||d.date>today){ui.msg="Pick a date on or before today.";return}
  var logs=S.logs.filter(function(l){return l.date!==d.date}).concat([Object.assign({},d,{pads:Math.max(0,Math.min(30,Math.round(Number(d.pads)||0)))})]).sort(function(a,b){return a.date.localeCompare(b.date)});
  if(persist(Object.assign({},S,{logs:logs}),"Daily log saved."))loadDraft(d.date)},
 delLog:function(){persist(Object.assign({},S,{logs:S.logs.filter(function(l){return l.date!==ui.draft.date})}),"Daily log deleted.");loadDraft(ui.draft.date)},
 backup:function(){
  var blob=new Blob([JSON.stringify({version:1,data:S},null,2)],{type:"application/json"}),a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download="cycle-nourish-backup.json";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},2000);ui.msg="Backup download requested. Keep the file private."},
 eraseAsk:function(){ui.erase=true},eraseNo:function(){ui.erase=false},
 erase:function(){ui.erase=false;persist(JSON.parse(JSON.stringify(DEF)),"All records and settings erased.")}
};
var root=document.getElementById("root");
root.addEventListener("click",function(e){
 var b=e.target.closest("[data-act]");if(!b)return;
 var f=A[b.getAttribute("data-act")];if(!f)return;
 f(b.getAttribute("data-v"));render();
});
var saveTimer=null;
root.addEventListener("input",function(e){
 var t=e.target,f=t.getAttribute("data-f");if(!f)return;
 if(f==="paste")ui.paste=t.value;
 else if(f==="pStart"){ui.pStart=t.value}
 else if(f==="pEnd"){ui.pEnd=t.value}
 else if(f==="pads"){ui.draft.pads=Math.max(0,Math.min(30,Math.round(Number(t.value)||0)))}
 else if(f==="pain"){ui.draft.pain=Number(t.value);var l=document.getElementById("painL");if(l)l.textContent="Pain: "+t.value+"/10"}
 else if(f==="energy"){ui.draft.energy=Number(t.value);var l2=document.getElementById("enL");if(l2)l2.textContent="Energy: "+t.value+"/5"}
 else if(f==="name"||f==="pet"||f==="note"){
  var key=f,val=t.value;
  clearTimeout(saveTimer);saveTimer=setTimeout(function(){var p={};p[key]=val.trim();withProfile(p,"Saved on this device.");var n=document.querySelector(".notice");if(n)n.textContent=ui.msg;else{render()}},500);
 }
});
root.addEventListener("change",function(e){
 var t=e.target,f=t.getAttribute("data-f");if(!f)return;
 if(f==="ldate"){if(okDate(t.value)&&t.value<=today)loadDraft(t.value);render()}
 else if(f==="pStart"||f==="pEnd"){render()}
 else if(f==="sym"){var s=ui.draft.symptoms;ui.draft.symptoms=t.checked?s.concat([t.value]):s.filter(function(x){return x!==t.value})}
 else if(f==="avoid"){var a=S.profile.avoid;withProfile({avoid:t.checked?a.concat([t.value]):a.filter(function(x){return x!==t.value})});render()}
 else if(f==="cycle"||f==="bleed"){var n=Number(t.value),lim=f==="cycle"?[21,45]:[1,10];if(Number.isInteger(n)&&n>=lim[0]&&n<=lim[1]){var p={};p[f]=n;withProfile(p)}else ui.msg="Use a whole number from "+lim[0]+" to "+lim[1]+".";render()}
 else if(f==="restore"){
  var file=t.files&&t.files[0];if(!file)return;
  file.text().then(function(txt){
   try{if(file.size>200000)throw 0;var u=JSON.parse(txt);if(u.version!==1)throw 0;u.data.profile=Object.assign({},DEF.profile,u.data.profile);if(!valid(u.data,today))throw 0;
    u.data.periods=sortP(u.data.periods);u.data.logs.sort(function(a,b){return a.date.localeCompare(b.date)});
    persist(u.data,"Backup restored. Existing records were replaced.")}
   catch(err){ui.msg="Backup not recognised or contains invalid data. Nothing was changed."}
   t.value="";render();
  });
 }
});
render();
})();
</script></body></html>
